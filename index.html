<!DOCTYPE html>
<html lang="en">
<head>

<title>La Pasta Bella</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="file.css">

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="#">🍝 La Pasta Bella</a>

<ul class="navbar-nav ms-auto">
<li><a class="nav-link" href="#" onclick="showPage('home')">Home</a></li>
<li><a class="nav-link" href="#" onclick="showPage('menu')">Menu</a></li>
<li><a class="nav-link" href="#" onclick="showPage('gallery')">Gallery</a></li>
</ul>
</div>
</nav>

<!-- HOME -->
<div id="home" class="page active-page">
<div class="hero">
<div>

<button class="btn btn-custom" onclick="showPage('menu')">Explore Menu</button>
</div>
</div>
</div>

<div id="menu" class="page container mt-5">
<h2 class="text-center">Menu</h2>

<div class="row mt-4">
<div class="col-md-4">
<div class="card p-3 text-center">
<h4>Veg</h4>
<p>Pasta ₹250</p>
<p>Pizza ₹300</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h4>Non-Veg</h4>
<p>Chicken Pasta ₹350</p>
<p>Chicken Pizza ₹400</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h4>Dessert</h4>
<p>Ice Cream ₹100</p>
<p>Brownie ₹220</p>
</div>
</div>
</div>
</div>

<div class="row mt-4 g-4">

<div class="col-md-4">

</div>

<div class="col-md-4">
  <img src="ot.jpg" class="gallery-img">

 <div class="col-md-4">
  <img src="kk.jpg" class="gallery-img">
</div>

<div class="col-md-4">
  <img src="dm.jpg" class="gallery-img">

<div class="col-md-4">

<p>📍 Nagpur | 📞 9876543210</p>
