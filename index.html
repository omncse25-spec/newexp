<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Pasta Bella</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="file.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand" href="#">🍝 La Pasta Bella</a>

<ul class="navbar-nav ms-auto">
<li><a class="nav-link" href="#" onclick="showPage('home')">Home</a></li>
<li><a class="nav-link" href="#" onclick="showPage('menu')">Menu</a></li>
<li><a class="nav-link" href="#" onclick="showPage('gallery')">Gallery</a></li>
</ul>
</div>
</nav>

<!-- HOME -->
<div id="home" class="page active-page">

<div class="hero">
<div>
<h1>Welcome to La Pasta Bella</h1>
<p>Best Italian Food 🍕</p>
<button class="btn btn-custom" onclick="showPage('menu')">Explore Menu</button>
</div>
</div>

<!-- TABLE RESERVATION -->
<div class="container section">
<h2 class="text-center mb-4">Table Reservation</h2>

<form>
<div class="mb-3"><input type="text" class="form-control" placeholder="Enter Name"></div>
<div class="mb-3"><input type="email" class="form-control" placeholder="Enter Email"></div>
<div class="mb-3"><input type="number" class="form-control" placeholder="Enter Phone"></div>
<div class="mb-3"><input type="date" class="form-control"></div>
<div class="mb-3"><input type="time" class="form-control"></div>

<div class="mb-3">
<select class="form-control">
<option>Select Guests</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4+</option>
</select>
</div>

<div class="text-center">
<button class="btn btn-custom">Book Table</button>
</div>
</form>
</div>

<!-- CONTACT -->
<div class="container section">
<h2 class="text-center">Contact Us</h2>

<form class="mt-4">
<input class="form-control mb-3" placeholder="Name">
<input class="form-control mb-3" placeholder="Email">
<textarea class="form-control mb-3" placeholder="Message"></textarea>
<button class="btn btn-custom">Send</button>
</form>
</div>

</div>

<!-- MENU -->
<div id="menu" class="page container mt-5">
<h2 class="text-center">Menu</h2>

<div class="row mt-4">
<div class="col-md-4">
<div class="card p-3 text-center">
<h4>Veg</h4>
<p>Pasta ₹250</p>
<p>Pizza ₹300</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h4>Non-Veg</h4>
<p>Chicken Pasta ₹350</p>
<p>Chicken Pizza ₹400</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h4>Dessert</h4>
<p>Ice Cream ₹100</p>
<p>Brownie ₹120</p>
</div>
</div>
</div>
</div>
<div id="gallery" class="page container mt-5">
<h2 class="text-center">Gallery</h2>

<div class="row mt-4 g-4"> <!-- g-4 = gap -->

<div class="col-md-4">
  <img src="pasta.jpg" class="gallery-img">
</div>

<div class="col-md-4">
  <img src="pizza.jpg" class="gallery-img">
</div>

<div class="col-md-4">
  <img src="sweet.jpg" class="gallery-img">
</div>

<div class="col-md-4">
  <img src="of.jpg" class="gallery-img">
</div>

<div class="col-md-4">
  <img src="it.jpg" class="gallery-img">
</div>

<div class="col-md-4">
  <img src="ot.jpg" class="gallery-img">
</div>

</div>
</div>

<!-- FOOTER -->
<footer>
<p>📍 Kolhapur | 📞 9876543210</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
