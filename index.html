<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Pasta Bella</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand" href="#">🍝 La Pasta Bella</a>

<ul class="navbar-nav ms-auto">
<li><a class="nav-link" href="#" onclick="showPage('home')">Home</a></li>
<li><a class="nav-link" href="#" onclick="showPage('menu')">Menu</a></li>
<li><a class="nav-link" href="#" onclick="showPage('gallery')">Gallery</a></li>
<li><a class="nav-link" href="#" onclick="showPage('feedback')">Feedback</a></li>
</ul>
</div>
</nav>

<!-- HOME -->
<div id="home" class="page active-page">

<div class="hero">
<div>
<h1>Welcome to La Pasta Bella</h1>
<p>Best Italian Food 🍕</p>
<button class="btn btn-custom" onclick="showPage('menu')">Explore Menu</button>
</div>
</div>

<!-- TABLE RESERVATION -->
<div class="container section">
<h2 class="text-center mb-4">Table Reservation</h2>

<form>
<div class="mb-3"><input type="text" class="form-control" placeholder="Enter Name"></div>
<div class="mb-3"><input type="email" class="form-control" placeholder="Enter Email"></div>
<div class="mb-3"><input type="number" class="form-control" placeholder="Enter Phone"></div>
<div class="mb-3"><input type="date" class="form-control"></div>
<div class="mb-3"><input type="time" class="form-control"></div>

<div class="mb-3">
<select class="form-control">
<option>Select Guests</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4+</option>
</select>
</div>

<div class="text-center">
<button class="btn btn-custom">Book Table</button>
</div>
</form>
</div>

<!-- CONTACT -->
<div class="container section">
<h2 class="text-center">Contact Us</h2>

<form>
<input class="form-control mb-3" placeholder="Name">
<input class="form-control mb-3" placeholder="Email">
<textarea class="form-control mb-3" placeholder="Message"></textarea>
<button class="btn btn-custom">Send</button>
</form>
</div>

</div>

<!-- MENU -->
<div id="menu" class="page container mt-5">
<h2 class="text-center">Menu</h2>
<p class="text-center">Delicious items here...</p>
</div>

<!-- GALLERY -->
<div id="gallery" class="page container mt-5">
<h2 class="text-center">Gallery</h2>
</div>

<!-- FEEDBACK -->
<div id="feedback" class="page container mt-5">

<h2 class="text-center mb-4">Customer Rating ⭐</h2>

<form id="feedbackForm">

<div class="mb-3">
<input type="text" class="form-control" placeholder="Your Name" required>
</div>

<div class="mb-3 text-center rating">
<span onclick="setRating(1)">★</span>
<span onclick="setRating(2)">★</span>
<span onclick="setRating(3)">★</span>
<span onclick="setRating(4)">★</span>
<span onclick="setRating(5)">★</span>
</div>

<input type="hidden" id="ratingValue">

<div class="mb-3">
<textarea class="form-control" placeholder="Write feedback..." required></textarea>
</div>

<div class="text-center">
<button class="btn btn-custom">Submit</button>
</div>

</form>

<p id="feedbackMsg" class="text-center mt-3"></p>

</div>

<!-- FOOTER -->
<footer>
<p>📍 Kolhapur | 📞 9876543210</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
